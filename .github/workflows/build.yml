name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # PHOTON_APP_ID приходит только из repository secrets. CMake скачивает
      # исходники Dobby на зафиксированном commit и статически линкует их.
      - name: Build (assembleRelease, armeabi-v7a)
        env:
          ORG_GRADLE_PROJECT_PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}
        run: gradle :opg3d:assembleRelease --no-daemon --stacktrace

      # Публичный артефакт этапа — ровно одна готовая библиотека.
      - name: Collect libopg3d.so
        run: |
          mkdir -p out
          find opg3d/build/intermediates -path "*armeabi-v7a*" -name "libopg3d.so" -exec cp -v {} out/ \;
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 1
          ls -la out/

      - name: Upload libopg3d.so
        uses: actions/upload-artifact@v4
        with:
          name: libopg3d-armeabi-v7a
          path: out/libopg3d.so
          if-no-files-found: error
