name: build

on:
  push:
    branches: [main, "13.2.1", "14.1.1", "16.1.0"]
  pull_request:
    branches: [main, "13.2.1", "14.1.1", "16.1.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The branch intentionally follows the newest native toolchain used by
      # the development host. ubuntu-latest can lag behind, so provision the
      # exact pinned versions instead of relying on the runner image.
      - name: Provision CMake 4.4.3 and NDK r29
        env:
          CMAKE_VERSION: "4.4.3"
          NDK_VERSION: "29.0.14206865"
        run: |
          set -euo pipefail

          CMAKE_LINE="$(cmake --version 2>/dev/null | sed -n '1p' || true)"
          if [ "$CMAKE_LINE" = "cmake version ${CMAKE_VERSION}" ]; then
            CMAKE_BIN="$(dirname "$(command -v cmake)")"
          else
            CMAKE_ARCHIVE="$RUNNER_TEMP/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
            CMAKE_HOME="$RUNNER_TEMP/cmake-${CMAKE_VERSION}-linux-x86_64"
            rm -rf "$CMAKE_HOME"
            curl --fail --location --retry 3 \
              --output "$CMAKE_ARCHIVE" \
              "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
            tar -xzf "$CMAKE_ARCHIVE" -C "$RUNNER_TEMP"
            CMAKE_BIN="$CMAKE_HOME/bin"
          fi
          test -x "$CMAKE_BIN/cmake"
          echo "$CMAKE_BIN" >> "$GITHUB_PATH"
          test "$("$CMAKE_BIN/cmake" --version | sed -n '1p')" = \
            "cmake version ${CMAKE_VERSION}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          NDK_HOME="$SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -f "$NDK_HOME/source.properties" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f \
                -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "ndk;${NDK_VERSION}"
          fi
          grep -q "^Pkg.Revision = ${NDK_VERSION}$" \
            "$NDK_HOME/source.properties"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"
          echo "CMake ${CMAKE_VERSION} and NDK ${NDK_VERSION} are ready"

      - name: Build PR (assembleRelease, armeabi-v7a, no Photon AppID)
        if: github.event_name == 'pull_request'
        run: gradle :opg3d:assembleRelease --no-daemon --stacktrace

      - name: Build trusted ref (assembleRelease, armeabi-v7a)
        if: github.event_name != 'pull_request'
        env:
          ORG_GRADLE_PROJECT_PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}
        run: gradle :opg3d:assembleRelease --no-daemon --stacktrace

      # A managed exception crossing one of our ARM hook frames must never be
      # handed to LLVM's incompatible generic C++ personality.
      - name: Assert no LLVM C++ personality in our frames
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ]; then
            NDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/ndk"
          fi
          NM="$(find "$NDK_ROOT" -type f -name 'llvm-nm' | head -n 1)"
          if [ -z "$NM" ]; then
            echo "::error::llvm-nm not found under $NDK_ROOT — fix the path in this guard"
            exit 1
          fi
          OBJS="$(find . -type f -name '*.cpp.o' -path '*opg3d.dir*')"
          if [ -z "$OBJS" ]; then
            echo "::error::opg3d object files not found — AGP changed the layout, fix the path in this guard"
            exit 1
          fi
          echo "$OBJS"
          if echo "$OBJS" | xargs "$NM" --undefined-only | grep -q '__gxx_personality_v0'; then
            echo "::error::libopg3d frames reference __gxx_personality_v0 — restore -fno-exceptions"
            exit 1
          fi
          echo "ok: no generic-model personality in our frames"

      - name: Verify exported ARMv7 libraries
        run: |
          test -f lib/armeabi-v7a/libopg3d.so
          test -f lib/armeabi-v7a/libopg3d.unstripped.so
          file lib/armeabi-v7a/libopg3d.so
          file lib/armeabi-v7a/libopg3d.unstripped.so
          ls -la lib/armeabi-v7a/

      - name: Upload ARMv7 libraries
        uses: actions/upload-artifact@v4
        with:
          name: libopg3d-armeabi-v7a
          path: |
            lib/armeabi-v7a/libopg3d.so
            lib/armeabi-v7a/libopg3d.unstripped.so
          if-no-files-found: error
