name: build

on:
  push:
    branches: [12.5.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # PHOTON_APP_ID comes only from repository secrets. CMake downloads the
      # shadowhook sources at the pinned tag, patches them and links them
      # statically into the single libopg3d.so.
      - name: Build (assembleRelease, armeabi-v7a)
        env:
          ORG_GRADLE_PROJECT_PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}
        run: gradle :opg3d:assembleRelease --no-daemon --stacktrace

      # Guard against stack-unwinder regressions.
      #
      # libil2cpp.so carries a GNU-compatible ARM EHABI unwinder and raises
      # managed exceptions through it. If a frame of our hook is described in
      # generic model with a reference to __gxx_personality_v0 from the
      # statically linked LLVM libc++abi, the first exception flying through
      # the hook crashes the game in __unw_set_reg. Details are in the
      # -fno-exceptions comment in opg3d/src/main/cpp/CMakeLists.txt.
      #
      # The danger is that without -fno-exceptions everything builds silently
      # and only breaks on the device when the connection drops, so CI checks
      # that the opg3d object files never reference that personality.
      - name: Assert no LLVM C++ personality in our frames
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ]; then
            NDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/ndk"
          fi
          NM="$(find "$NDK_ROOT" -type f -name 'llvm-nm' | head -n 1)"
          if [ -z "$NM" ]; then
            echo "::error::llvm-nm not found under $NDK_ROOT — fix the path in this guard"
            exit 1
          fi
          OBJS="$(find . -type f -name '*.cpp.o' -path '*opg3d.dir*')"
          if [ -z "$OBJS" ]; then
            echo "::error::opg3d object files not found — AGP changed the layout, fix the path in this guard"
            exit 1
          fi
          echo "$OBJS"
          if echo "$OBJS" | xargs "$NM" --undefined-only | grep -q '__gxx_personality_v0'; then
            echo "::error::libopg3d frames reference __gxx_personality_v0 — a managed exception will crash the game. Restore -fno-exceptions."
            exit 1
          fi
          echo "ok: no generic-model personality in our frames"

      # The stage's public artifact is exactly one ready library.
      - name: Collect libopg3d.so
        run: |
          mkdir -p out
          find opg3d/build/intermediates -path "*armeabi-v7a*" -name "libopg3d.so" -exec cp -v {} out/ \;
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 1
          ls -la out/

      - name: Upload libopg3d.so
        uses: actions/upload-artifact@v4
        with:
          name: libopg3d-armeabi-v7a
          path: out/libopg3d.so
          if-no-files-found: error
